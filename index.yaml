# Master manifest for the multi-release docs build.
# Each release is identified by a short commit hash from
# https://github.com/open-rmf/next_gen_prototype
#
# - "base:" is the canonical shared content directory (a commit hash).
#   All releases build from this tree + their own overlay, so switching
#   the canonical base in the future only requires updating this pointer
#   (plus keeping "preferred: true" on the release that maps to it or
#   the newest one you want advertised as "latest").
# - "releases:" is the set of versioned snapshots.
# - "common/" (at the repo root, next to the release directories) holds
#   version-independent content that is shared by ALL releases — it is
#   overlaid last, so it always wins over any file of the same path in a
#   release directory (whether it comes from the base or the release itself).
#   Reference it with the "common:" prefix in index.yaml files
#   (e.g. "common:reference/governance.md"). The Reference section lives here.
# - Exactly one release must have "preferred: true" (it becomes "latest").
#
# See the README for the full reference.

base: 334e5b2

releases:
  - name: 334e5b2
    base: true
    lts: false
    dev: false
    eol: false
    preferred: true
    description: Canonical base snapshot (commit 334e5b2 on open-rmf/next_gen_prototype main)
    commit_url: https://github.com/open-rmf/next_gen_prototype/commit/334e5b2

  - name: 251cfbf
    base: false
    lts: false
    dev: false
    eol: false
    preferred: false
    description: Earlier content snapshot (commit 251cfbf on open-rmf/next_gen_prototype main)
    commit_url: https://github.com/open-rmf/next_gen_prototype/commit/251cfbf
